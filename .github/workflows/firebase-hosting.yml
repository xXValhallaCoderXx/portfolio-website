name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: renate-gouveia-portfolio

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://renate-gouveia-portfolio.web.app
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        # The game's balance and the replays of its runs rest on these: nothing deploys if one fails.
        run: npm test

      - name: Check the page carries none of the game beyond the arch
        run: npm run check:split

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.33.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          workload_identity_provider: projects/194838900506/locations/global/workloadIdentityPools/github-actions/providers/portfolio-main
          service_account: github-hosting-deploy@renate-gouveia-portfolio.iam.gserviceaccount.com

      - name: Build and deploy to Firebase Hosting
        # firebase.json's predeploy hook builds dist/ and aborts deployment if the build fails.
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
